# Setup test environment using the local mockserver
up:
  name: setup-test-environment
  env:
    test_data: "embedded-test-data"
  request:
    method: POST
    url: "http://127.0.0.1:18080/post"
    headers:
      - name: Content-Type
        value: application/json
      - name: X-Test-Run
        value: "embedded-test"
    body: |
      {
        "project": "embedded-test",
        "environment": "test",
        "test_data": "embedded-test-data",
        "timestamp": "embedded-test"
      }
  response:
    result_code: ["200"]
    env_from:
      setup_id: "json.project"
      setup_timestamp: "json.test_data"

down:
  name: cleanup-setup
  method: POST
  url: "http://127.0.0.1:18080/post"
  headers:
    - name: Content-Type
      value: application/json
  body: |
    {
      "action": "cleanup",
      "setup_id": "embedded-test"
    }