# Validate the setup was successful
up:
  name: validate-setup
  env:
    validation_data: "validating-setup"
  request:
    method: GET
    url: "http://127.0.0.1:18080/json"
    headers:
      - name: X-Validation-Run
        value: "embedded-test"
      - name: X-Setup-ID
        value: "embedded-test"
  response:
    result_code: ["200"]
    env_from:
      validation_status: "slideshow.title"
      validation_timestamp: "slideshow.date"

down:
  name: cleanup-validation
  method: POST
  url: "http://127.0.0.1:18080/post"
  headers:
    - name: Content-Type
      value: application/json
  body: |
    {
      "action": "cleanup_validation",
      "setup_id": "embedded-test"
    }